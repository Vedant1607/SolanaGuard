# Render Blueprint for the SolanaGuard API (FastAPI) and its history refresh.
# The web app is deployed separately on Vercel (apps/web).
#
# No secret values are stored here. Variables marked `sync: false` are entered
# in the Render dashboard when the Blueprint is first applied. INTERNAL_API_SECRET
# is generated by Render (read it from the dashboard to call internal endpoints).
#
# DATABASE_URL must be Neon's DIRECT (non-pooled) connection string, with
# sslmode=require: the API and the cron job use session-level advisory locks
# and asyncpg prepared statements, which a transaction-mode pooler breaks.
#
# Production checks (apps/api/app/config.py, ENVIRONMENT=production): the API
# refuses to start if DEBUG is true, ALLOWED_ORIGINS is missing or not https,
# INTERNAL_API_SECRET is shorter than 32 characters, or the local identity-gated
# history scheduler is enabled.

services:
  # One always-on API instance. It also runs the in-process ingestion (5 min),
  # anomaly detector (15 min) and security collector (15 min) loops, so it must
  # not use a plan that sleeps when idle. Each loop takes a Postgres advisory
  # lock, so an accidental second instance skips instead of duplicating work.
  - type: web
    name: solanaguard-api
    runtime: docker
    plan: starter
    branch: main
    autoDeployTrigger: off # enable once the first deployment has been verified
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DEFILLAMA_HISTORY_REFRESH_ENABLED # hosted refresh is the cron job below
        value: "false"
      - key: SECURITY_COLLECTOR_ENABLED
        value: "true"
      - key: ALLOWED_ORIGINS # JSON list of https origins, e.g. ["https://<your-vercel-domain>"]
        sync: false
      - key: DATABASE_URL # Neon direct connection string
        sync: false
      - key: INTERNAL_API_SECRET # header X-Internal-Api-Secret for /ingest, /test-alert, /test-message
        generateValue: true
      - key: HELIUS_API_KEY
        sync: false
      - key: SOLANA_RPC_URL # required: without it the security collector stays idle when DEBUG=false
        sync: false
      - key: RESEND_API_KEY # optional: email alerts
        sync: false
      - key: ALERT_FROM_EMAIL # optional: verified Resend sender
        sync: false
      - key: TELEGRAM_BOT_TOKEN # optional: Telegram alerts
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET # required for the webhook; 1-256 chars of A-Z a-z 0-9 _ - (e.g. openssl rand -hex 32)
        sync: false

  # DefiLlama daily TVL + token history, every 6 hours (UTC). Same Docker image,
  # one short-lived process per run: TVL then token backfill under the shared
  # advisory lock. Exit 1 (job failed/partial) or 2 (target check failed) marks
  # the run as failed in Render.
  - type: cron
    name: solanaguard-history-refresh
    runtime: docker
    plan: starter
    branch: main
    autoDeployTrigger: off
    schedule: "20 */6 * * *"
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerCommand: uv run python scripts/refresh_defillama_history.py
    buildFilter:
      paths:
        - apps/api/**
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DEFILLAMA_HISTORY_REFRESH_ENABLED
        value: "false"
      - key: DEFILLAMA_REFRESH_EXPECTED_DATABASE # Neon database name, e.g. neondb; checked against current_database()
        sync: false
      - key: DATABASE_URL
        fromService:
          type: web
          name: solanaguard-api
          envVarKey: DATABASE_URL
      - key: ALLOWED_ORIGINS # not used by the job; required by the shared production settings check
        fromService:
          type: web
          name: solanaguard-api
          envVarKey: ALLOWED_ORIGINS
